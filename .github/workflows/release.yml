name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.0.0-dev"
          chmod +x build.sh
          UNIVERSAL=1 VERSION="$VERSION" ./build.sh

      - name: Zip
        run: cd build && ditto -c -k --keepParent ClaudeHUD.app ClaudeHUD.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD
          path: build/ClaudeHUD.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ClaudeHUD.zip
          generate_release_notes: true
